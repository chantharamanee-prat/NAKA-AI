# Studio (apps/studio): backend and frontend checks on pushes/PRs that touch it.
name: Studio CI

on:
  push:
    # the entitlement test loads the account migrations (docs/entitlements.md)
    paths: ['apps/studio/**', 'apps/landing/migrations/pg/**', '.github/workflows/studio-ci.yml']
  pull_request:
    # the entitlement test loads the account migrations (docs/entitlements.md)
    paths: ['apps/studio/**', 'apps/landing/migrations/pg/**', '.github/workflows/studio-ci.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/studio/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # docs/adr/0004 step 9: the old SQLite → PostgreSQL import (node:sqlite builds the old file; Node 24)
      - run: npx tsx --test tests/import-sqlite.test.ts
      # drama art styles (Live Action / Animation catalog + Custom style)
      - run: npx tsx --test tests/art-styles.test.ts
      # tests run on PGlite (in-process PostgreSQL, DATABASE_URL=pglite://…): no database service needed
      # naka-sso.test.ts also checks the contract against apps/landing/src/auth/studio.ts (same checkout)
      - run: npx tsx --test tests/campaigns-migration.test.ts tests/server-security-recovery.test.ts tests/hypit-render.test.ts tests/admin-guard.test.ts tests/seller.test.ts tests/naka-sso.test.ts tests/ownership.test.ts tests/entitlements.test.ts tests/credits.test.ts tests/concurrency.test.ts tests/query-budget.test.ts tests/system-overview.test.ts tests/module-boundaries.test.mjs
      # AI Marketer quick start: analyses (marketer_insights), autopilot, per-member scope
      - run: npx tsx --test tests/marketer-quick.test.ts
      # Social Auto Reply: poller, plain rules, verdicts, person actions, auto mode, limits, Facebook adapter, connect, per-member scope
      - run: npm run test:social

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/studio/frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/video-preflight.test.mjs tests/ai-seller-structure.test.mjs tests/settings-in-app.test.mjs tests/settings-page.test.mjs tests/settings-providers.test.mjs
      - run: npm run build
      # AI Marketer quick start: media files on disk + page/dialog structure + i18n
      - run: node --test tests/marketer-media.test.mjs tests/marketer-quick-structure.test.mjs
      # drama art style tabs (Live Action / Animation / Custom)
      - run: node --test tests/drama-art-styles.test.mjs tests/menu-art.test.mjs tests/influencer-presets.test.mjs
      # Social Auto Reply: board, accounts and brand pages + i18n
      - run: node --test tests/social-structure.test.mjs tests/social-actions.test.mjs tests/social-accounts.test.mjs tests/social-limits.test.mjs
