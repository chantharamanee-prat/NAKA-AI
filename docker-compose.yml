# NAKA-AI platform on one Docker host (docs/adr/0002, docs/adr/0004).
#
#   cp .env.example .env    # then set every password
#   docker compose up -d postgres
#
#   docker compose up -d --build            # postgres + landing (naka-ai.com) + studio
#   docker compose up -d --build studio     # rebuild/restart one app
#
# Both apps are on PostgreSQL (ADR-0004 phases 1–2), one schema and one login each.
name: naka

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: naka
      POSTGRES_USER: ${POSTGRES_USER:-naka_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Set ACCOUNT_DB_PASSWORD in .env}
      STUDIO_DB_PASSWORD: ${STUDIO_DB_PASSWORD:?Set STUDIO_DB_PASSWORD in .env}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?Set REPORTING_DB_PASSWORD in .env}
      TZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs once, on an empty volume (schemas, roles, passwords)
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    # local tools only (psql, DBeaver); apps reach it as postgres:5432 on the compose network
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d naka"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  landing:
    build: ./apps/landing
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://account_app:${ACCOUNT_DB_PASSWORD}@postgres:5432/naka
      MEDIA_DIR: /data/media
      # the back office's "ระบบ Studio" page reads the studio over this network; STUDIO_ADMIN_TOKEN (= the
      # studio's ADMIN_TOKEN) goes in apps/landing/.env.production or /admin/system/
      STUDIO_INTERNAL_URL: http://studio:5679
      BACKUP_DIR: /data/backups
      TZ: Asia/Bangkok
    # the Worker's vars and secrets (APP_ORIGIN, SESSION_SECRET, ADMIN_TOKEN, …) — see apps/landing/.env.example
    env_file:
      - path: ./apps/landing/.env.production
        required: false
    volumes:
      - landing-media:/data/media
      # the back office shows the latest backup (สถานะเซิร์ฟเวอร์); read only
      - pg-backups:/data/backups:ro
    # behind Caddy / Cloudflare Tunnel in production (ADR-0002); local port for testing
    ports:
      - "127.0.0.1:8788:8788"
    restart: unless-stopped

  studio:
    image: kimyohant/naka-ai:latest
    build:
      context: ./apps/studio
      args:
        NAKA_VERSION: ${NAKA_VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://studio_app:${STUDIO_DB_PASSWORD}@postgres:5432/naka
      NAKA_HOST: 0.0.0.0
      TZ: Asia/Bangkok
    # NAKA_AUTH_USER/NAKA_AUTH_PASSWORD or NAKA_SSO_URL/NAKA_SSO_SECRET, ADMIN_TOKEN, PUBLIC_BASE_URL, …
    # — see apps/studio/.env.example (the server refuses to start without auth)
    env_file:
      - path: ./apps/studio/.env.production
        required: false
    volumes:
      # generated media + editable workspace (skills/prompts); the database is postgres now
      - studio-data:/app/data
    ports:
      - "127.0.0.1:5679:5679"
    restart: unless-stopped

  # a pg_dump of the whole database every BACKUP_EVERY_HOURS hours, kept BACKUP_KEEP_DAYS days (infra/backup/backup.sh).
  # Copy the pg-backups volume off this machine as well: a backup on the same disk does not survive the disk.
  backup:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-naka_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: naka
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Bangkok
    volumes:
      - pg-backups:/backups
      - ./infra/backup/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    restart: unless-stopped

volumes:
  pgdata:
  pg-backups:
  landing-media:
  # the volume apps/studio/docker-compose.yml used (project naka-drama-studio): kept by name so existing
  # media and workspace edits carry over; compose creates it on a fresh host
  studio-data:
    name: naka-drama-studio_naka-data
