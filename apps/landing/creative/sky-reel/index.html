<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <style>
      @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 500; font-style: normal; src: url("assets/fonts/IBMPlexSansThai-500-thai.woff2") format("woff2"); unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC; }
      @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 500; font-style: normal; src: url("assets/fonts/IBMPlexSansThai-500-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Kanit"; font-weight: 600; font-style: normal; src: url("assets/fonts/Kanit-600-thai.woff2") format("woff2"); unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC; }
      @font-face { font-family: "Kanit"; font-weight: 600; font-style: normal; src: url("assets/fonts/Kanit-600-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Kanit"; font-weight: 700; font-style: normal; src: url("assets/fonts/Kanit-700-thai.woff2") format("woff2"); unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC; }
      @font-face { font-family: "Kanit"; font-weight: 700; font-style: normal; src: url("assets/fonts/Kanit-700-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

      :root { --ground: #f3f7fb; --ink: #14233b; --brand: #1d50be; --accent: #f97316; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Kanit", sans-serif; color: var(--ink); }
      .layer { position: absolute; inset: 0; }
      #sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

      /* masks: a line of type rises through its own window */
      .mask { display: block; overflow: hidden; padding: 0.06em 0 0.12em; }
      .mask > span { display: block; white-space: nowrap; }

      /* scene 1: the rain, three pains */
      #pains { position: absolute; left: 120px; top: 150px; width: 1500px; font-weight: 700; font-size: 190px; line-height: 1.02; letter-spacing: -0.01em; }
      #pains .row { position: relative; display: block; width: fit-content; }
      #pains .strike { position: absolute; left: -12px; right: -12px; top: 54%; height: 16px; border-radius: 8px; background: var(--accent); display: block; }

      /* scene 2: the drop and the photo */
      #photo { position: absolute; left: 900px; top: 230px; width: 560px; height: 640px; border-radius: 40px; overflow: hidden; box-shadow: 0 40px 80px rgba(20, 45, 90, 0.28); }
      #photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #cap1 { position: absolute; left: 120px; top: 300px; width: 760px; font-weight: 700; }
      #cap1 .a { font-size: 112px; line-height: 1.1; }
      #cap1 .b { font-size: 260px; line-height: 1; }
      #cap1 .b em { font-style: normal; color: var(--brand); }

      /* scene 3: phones in a 3D arc */
      #big { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 18px; }
      #big span { display: block; font-weight: 700; font-size: 330px; line-height: 1.15; color: rgba(29, 80, 190, 0.07); -webkit-text-stroke: 4px rgba(29, 80, 190, 0.55); white-space: nowrap; }
      #stage { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 45%; }
      #cam { position: absolute; inset: 0; transform-style: preserve-3d; }
      .phone { position: absolute; top: 500px; width: 290px; height: 516px; transform-style: preserve-3d; }
      .phone .scr { position: absolute; inset: 0; border-radius: 40px; overflow: hidden; border: 8px solid #0d1830; background: #0d1830; box-shadow: 0 40px 70px rgba(20, 45, 90, 0.3); }
      .phone img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .phone .chip { position: absolute; left: 0; right: 0; top: -78px; display: flex; justify-content: center; }
      .phone .chip b { display: block; padding: 10px 22px; border-radius: 999px; background: #ffffff; color: var(--ink); font-weight: 600; font-size: 34px; line-height: 1.2; box-shadow: 0 10px 24px rgba(20, 45, 90, 0.14); white-space: nowrap; }
      .phone .chip b.live { background: #e5484d; color: #ffffff; }
      #p0 { left: 205px; } #p1 { left: 625px; } #p2 { left: 1005px; } #p3 { left: 1425px; }

      /* scene 4: the sky clears */
      #naka { position: absolute; left: 1170px; top: 250px; width: 620px; height: 620px; display: block; filter: drop-shadow(0 40px 50px rgba(20, 45, 90, 0.25)); }
      #line2 { position: absolute; left: 120px; top: 330px; width: 1100px; font-weight: 700; }
      #line2 .a { font-size: 150px; line-height: 1.1; }
      #line2 .b { font-size: 176px; line-height: 1.05; color: var(--brand); }

      /* scene 5: signature */
      #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #logo { display: block; width: 230px; height: 230px; overflow: visible; }
      #word { margin-top: 26px; font-weight: 700; font-size: 150px; line-height: 1; letter-spacing: -0.03em; }
      #word span b { color: var(--brand); }
      #tag { margin-top: 18px; font-weight: 600; font-size: 64px; line-height: 1.2; }
      #fine { position: absolute; left: 0; right: 0; bottom: 54px; text-align: center; font-family: "IBM Plex Sans Thai", sans-serif; font-weight: 500; font-size: 26px; color: #4b5b74; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <canvas id="sky" width="960" height="540"></canvas>
      <canvas id="fx" width="1920" height="1080" data-layout-allow-overflow></canvas>

      <div id="pains">
        <div class="row" id="pain0"><div class="mask" data-layout-allow-overflow><span>ถ่ายไม่เป็น</span></div><i class="strike"></i></div>
        <div class="row" id="pain1"><div class="mask" data-layout-allow-overflow><span>ตัดต่อไม่เป็น</span></div><i class="strike"></i></div>
        <div class="row" id="pain2"><div class="mask" data-layout-allow-overflow><span>ไลฟ์ไม่ไหว</span></div><i class="strike"></i></div>
      </div>

      <div id="cap1">
        <div class="mask a" data-layout-allow-overflow><span>แค่มีรูปสินค้า</span></div>
        <div class="mask b" data-layout-allow-overflow><span><em>1</em> รูป</span></div>
      </div>
      <div id="photo"><img src="assets/img/tea.jpg" alt="ชาไทยเย็น" /></div>

      <div id="big"><span data-layout-allow-occlusion>คลิปขาย</span></div>
      <div id="stage">
        <div id="cam">
          <div class="phone" id="p0"><div class="scr"><img src="assets/img/thai-tea.jpg" alt="" /></div><div class="chip" data-layout-allow-overflow><b>รีวิวสินค้า</b></div></div>
          <div class="phone" id="p1"><div class="scr"><img src="assets/img/dr-heir.jpg" alt="" /></div><div class="chip" data-layout-allow-overflow><b>ละครสั้น</b></div></div>
          <div class="phone" id="p2"><div class="scr"><img src="assets/img/lv-skincare.jpg" alt="" /></div><div class="chip" data-layout-allow-overflow><b class="live">AI Live</b></div></div>
          <div class="phone" id="p3"><div class="scr"><img src="assets/img/bt-packing.jpg" alt="" /></div><div class="chip" data-layout-allow-overflow><b>แชทบอท</b></div></div>
        </div>
      </div>

      <div id="line2">
        <div class="mask a" data-layout-allow-overflow><span>ที่เหลือ</span></div>
        <div class="mask b" data-layout-allow-overflow><span>นาคาทำให้หมด</span></div>
      </div>
      <img id="naka" src="assets/img/naka.png" alt="นาคา" />

      <div id="end">
        <svg id="logo" viewBox="0 0 48 48" aria-label="naka-ai">
          <rect class="lg-sq" width="48" height="48" rx="12" fill="#1D50BE" />
          <path class="lg-body" pathLength="1" stroke-dasharray="1 1.01" d="M11.5 34.5V20.5c0-5.3 2.7-8.5 7-8.5 8.2 0 7 24 14 24 3.8 0 5.8-3.2 5.8-8V20" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
          <path class="lg-head" d="M11.8 33.1c-2.9 1.2-5 .25-6.2-2.55-.35 3.55 1.3 6.75 4.85 7.55 3.1.7 5.7-.85 6.55-3.75-1.7 1.05-3.85.85-5.2-1.25z" fill="#fff" />
          <path class="lg-head" d="M7.8 33c.9 1.45 2.1 2.2 3.75 2.15" fill="none" stroke="#8DDDF3" stroke-width="1.3" stroke-linecap="round" />
          <path class="lg-head" d="M32.9 15.9c-.5-3.5.55-6.15 3.4-8.3.1 2.7.7 4.5 2.3 6.1z" fill="#8DDDF3" />
          <path class="lg-head" d="M35.15 14.3c.3-3.75 1.65-6.3 4.65-8.3-.05 3.25.5 5.2 2.05 6.8z" fill="#fff" />
          <path class="lg-head" d="M34.05 17.5c.45-3.05 2.55-5.1 5.3-5.1 2.5 0 4.45 1.6 4.45 3.55 0 1.15-.45 1.85-1.25 2.4l1.15 1.1c-1.85 1.45-4.55 2.1-7 1.2-1.65-.6-2.65-1.55-2.65-3.15z" fill="#fff" />
          <circle class="lg-head" cx="39.85" cy="16.1" r="1.25" fill="#12316D" />
          <path class="lg-head" d="M39.3 18.95c.7.45 1.5.4 2.2-.1" fill="none" stroke="#1D50BE" stroke-width=".8" stroke-linecap="round" />
        </svg>
        <div id="word" class="mask" data-layout-allow-overflow><span>naka<b>-ai.</b></span></div>
        <div id="tag" class="mask" data-layout-allow-overflow><span>แค่มีรูปสินค้า ก็ได้คลิปขาย</span></div>
      </div>
      <p id="fine">ตัวอย่างสาธิต · คลิปในมือถือทำด้วยนาคา · naka-ai.com</p>

      <audio id="score" src="assets/audio/score.wav" data-start="0" data-duration="15" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
      // ---------- helpers: time in, state out (no clocks, no unseeded random) ----------
      const { b, cue, W, H } = CFG;
      const clamp = (x, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, x));
      const lerp = (a, c, k) => a + (c - a) * k;
      const E = {
        inOut3: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
        in2: (x) => x * x,
        out3: (x) => 1 - Math.pow(1 - x, 3),
      };
      const mapRange = (t, a, c, from, to, ease = (x) => x) => lerp(from, to, ease(clamp((t - a) / (c - a))));
      function mulberry32(seed) {
        return () => {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }

      // ---------- sky: the site's after-rain shader, driven by t ----------
      const oklchToRgb = ([L, C, h]) => {
        const a = C * Math.cos((h * Math.PI) / 180), bb = C * Math.sin((h * Math.PI) / 180);
        const l = (L + 0.3963377774 * a + 0.2158037573 * bb) ** 3;
        const m = (L - 0.1055613458 * a - 0.0638541728 * bb) ** 3;
        const s = (L - 0.0894841775 * a - 1.291485548 * bb) ** 3;
        return [
          4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
          -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
          -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
        ].map((v) => { const c = clamp(v); return c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055; });
      };
      const mixOklch = (p, q, k) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k), lerp(p[2], q[2], k)];
      const RAIN = { top: [0.66, 0.03, 250], mid: [0.83, 0.022, 245], sun: [0.9, 0.02, 80] };
      const CLEAR = { top: [0.72, 0.105, 246], mid: [0.9, 0.05, 238], sun: [0.95, 0.075, 72] };
      const GROUND = [0.973, 0.007, 245];
      const clearAt = (t) => mapRange(t, b(cue.clearFrom), b(cue.clearTo), 0, 1, E.inOut3);

      const skyCanvas = document.getElementById("sky");
      const gl = skyCanvas.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
      let drawSky;
      if (gl) {
        const FRAG = `
precision highp float;
uniform vec2 uRes; uniform float uTime, uClear;
uniform vec3 uTop, uMid, uGround, uSun;
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p);
  float a = hash(i), b = hash(i + vec2(1.0, 0.0)), c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
  vec2 u = f * f * (3.0 - 2.0 * f); return mix(mix(a, b, u.x), mix(c, d, u.x), u.y); }
float fbm(vec2 p){ float v = 0.0, a = 0.5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = m * p; a *= 0.5; } return v; }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes; float aspect = uRes.x / uRes.y; float y = uv.y;
  vec3 col = mix(uGround, uMid, smoothstep(0.0, 0.45, y));
  col = mix(col, uTop, smoothstep(0.45, 1.05, y));
  vec2 d = (uv - vec2(0.84, 1.06)) * vec2(aspect, 1.0); float r = length(d);
  col += uSun * exp(-r * 2.2) * (0.12 + 0.6 * uClear);
  float ang = atan(d.y, d.x);
  float rays = noise(vec2(ang * 9.0, uTime * 0.12)) * noise(vec2(ang * 17.0 + 4.0, -uTime * 0.08));
  col += uSun * rays * exp(-r * 1.1) * 0.42 * uClear;
  vec2 p = vec2(uv.x * aspect, y);
  float cover = mix(0.34, 0.47, uClear);
  vec2 q1 = p * vec2(3.6, 8.0) + vec2(uTime * 0.05, 0.0);
  float w1 = fbm(q1 + 0.5 * fbm(q1 * 0.7 + uTime * 0.02));
  float c1 = smoothstep(cover + 0.06, cover + 0.22, w1) * smoothstep(0.25, 0.65, y) * 0.7;
  vec2 q2 = p * vec2(2.2, 4.6) + vec2(7.3 + uTime * 0.09, 1.7);
  float w2 = fbm(q2 + 0.6 * fbm(q2 * 0.8 - uTime * 0.03));
  float c2 = smoothstep(cover + 0.04, cover + 0.2, w2) * smoothstep(0.18, 0.6, y);
  vec3 lit = mix(vec3(0.88, 0.9, 0.93), vec3(1.0), uClear);
  vec3 belly = mix(vec3(0.56, 0.62, 0.71), vec3(0.74, 0.82, 0.93), uClear);
  col = mix(col, mix(belly, lit, 0.55 + 0.45 * smoothstep(cover, cover + 0.5, w1)), c1);
  col = mix(col, mix(belly, lit, smoothstep(cover + 0.04, cover + 0.34, w2)), c2 * 0.94);
  col += (hash(gl_FragCoord.xy + uTime) - 0.5) * (2.0 / 255.0);
  gl_FragColor = vec4(col, 1.0);
}`;
        const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
        const prog = gl.createProgram();
        gl.attachShader(prog, sh(gl.VERTEX_SHADER, "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }"));
        gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
        gl.linkProgram(prog);
        gl.useProgram(prog);
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(prog, "p");
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        const U = {};
        ["uRes", "uTime", "uClear", "uTop", "uMid", "uGround", "uSun"].forEach((n) => (U[n] = gl.getUniformLocation(prog, n)));
        gl.viewport(0, 0, skyCanvas.width, skyCanvas.height);
        gl.uniform2f(U.uRes, skyCanvas.width, skyCanvas.height);
        gl.uniform3fv(U.uGround, oklchToRgb(GROUND));
        drawSky = (t) => {
          const k = clearAt(t);
          gl.uniform1f(U.uTime, t);
          gl.uniform1f(U.uClear, k);
          gl.uniform3fv(U.uTop, oklchToRgb(mixOklch(RAIN.top, CLEAR.top, k)));
          gl.uniform3fv(U.uMid, oklchToRgb(mixOklch(RAIN.mid, CLEAR.mid, k)));
          gl.uniform3fv(U.uSun, oklchToRgb(mixOklch(RAIN.sun, CLEAR.sun, k)));
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        };
      } else {
        const c2d = skyCanvas.getContext("2d");
        drawSky = (t) => {
          const k = clearAt(t);
          const g = c2d.createLinearGradient(0, 0, 0, skyCanvas.height);
          const css = (c) => `rgb(${c.map((v) => Math.round(v * 255)).join(",")})`;
          g.addColorStop(0, css(oklchToRgb(mixOklch(RAIN.top, CLEAR.top, k))));
          g.addColorStop(0.5, css(oklchToRgb(mixOklch(RAIN.mid, CLEAR.mid, k))));
          g.addColorStop(1, css(oklchToRgb(GROUND)));
          c2d.fillStyle = g;
          c2d.fillRect(0, 0, skyCanvas.width, skyCanvas.height);
        };
      }

      // ---------- fx: rain, the drop, ripples ----------
      const fx = document.getElementById("fx").getContext("2d");
      const rand = mulberry32(7);
      const DIR = [-0.2, 1];
      const NORM = Math.hypot(DIR[0], DIR[1]);
      const streaks = Array.from({ length: 240 }, () => ({
        x: rand() * W * 1.3 - W * 0.1, y: rand() * (H + 240), v: 1500 + rand() * 900,
        len: 50 + rand() * 80, w: 1.2 + rand() * 1.8, a: 0.28 + rand() * 0.4, lag: rand() * 0.35,
      }));
      const DROP = { x: 1180, top: 120, land: 550 };
      const rainAt = (s, t) => {
        const yy = ((s.y + s.v * t) % (H + 240)) - 120;
        return [s.x + (DIR[0] / DIR[1]) * yy, yy];
      };
      function drawFx(t) {
        fx.clearRect(0, 0, W, H);
        const tFreeze = b(cue.freeze), tDrop = b(cue.drop), tImpact = b(cue.impact);
        fx.lineCap = "round";
        if (t < tDrop) {
          for (const s of streaks) {
            const [fxX, fxY] = rainAt(s, Math.min(t, tFreeze));
            const k = E.inOut3(clamp((t - tFreeze - s.lag * b(0.6)) / (b(1) - s.lag * b(0.6))));
            const x = lerp(fxX, DROP.x, k), y = lerp(fxY, DROP.top, k);
            const len = s.len * (1 - k);
            const alpha = s.a * (1 - k * 0.6) * (t < 0.3 ? t / 0.3 : 1);
            if (len < 1) continue;
            fx.strokeStyle = `rgba(246, 250, 255, ${alpha})`;
            fx.lineWidth = s.w;
            fx.beginPath();
            fx.moveTo(x, y);
            fx.lineTo(x - (DIR[0] / NORM) * len, y - (DIR[1] / NORM) * len);
            fx.stroke();
          }
        }
        // the drop gathers, falls, lands
        if (t > tDrop - b(0.6) && t < tImpact) {
          const grow = E.out3(clamp((t - (tDrop - b(0.6))) / b(0.6)));
          const y = mapRange(t, tDrop, tImpact, DROP.top, DROP.land, E.in2);
          const r = 34 * grow;
          fx.fillStyle = "rgba(255, 255, 255, 0.95)";
          fx.beginPath();
          fx.moveTo(DROP.x, y - r * 2.1);
          fx.bezierCurveTo(DROP.x + r * 1.2, y - r * 0.6, DROP.x + r, y + r, DROP.x, y + r);
          fx.bezierCurveTo(DROP.x - r, y + r, DROP.x - r * 1.2, y - r * 0.6, DROP.x, y - r * 2.1);
          fx.fill();
          fx.fillStyle = "rgba(29, 80, 190, 0.35)";
          fx.beginPath();
          fx.arc(DROP.x - r * 0.3, y + r * 0.1, r * 0.25, 0, Math.PI * 2);
          fx.fill();
        }
        // ripples become the photo's frame
        for (let i = 0; i < 4; i++) {
          const dt = t - tImpact - i * 0.14;
          if (dt <= 0 || dt > 1.6) continue;
          const k = dt / 1.6;
          fx.strokeStyle = `rgba(255, 255, 255, ${(1 - k) * 0.85})`;
          fx.lineWidth = 4 * (1 - k) + 1;
          fx.beginPath();
          fx.ellipse(DROP.x, DROP.land, 60 + 640 * E.out3(k), (60 + 640 * E.out3(k)) * 0.9, 0, 0, Math.PI * 2);
          fx.stroke();
        }
      }
      function render(t) { drawSky(t); drawFx(t); }

      // ---------- choreography ----------
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: CFG.DURATION_SEC, duration: CFG.DURATION_SEC, ease: "none", onUpdate: () => render(clock.t) }, 0);

      // initial states (set once, before any tween)
      gsap.set(["#pains .mask > span", "#cap1 .mask > span", "#line2 .mask > span", "#word > span", "#tag > span"], { yPercent: 115 });
      gsap.set("#pains .strike", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set("#photo", { clipPath: "circle(0% at 50% 50%)", x: 0, y: 0, scale: 1, opacity: 1 });
      gsap.set("#big span", { scale: 0.85, opacity: 0 });
      gsap.set("#naka", { y: 760, rotation: -8, opacity: 1 });
      gsap.set("#logo .lg-sq", { scale: 0, transformOrigin: "50% 50%" });
      gsap.set("#logo .lg-body", { strokeDashoffset: 1 });
      gsap.set("#logo .lg-head", { opacity: 0, scale: 0.5, transformOrigin: "50% 70%" });
      gsap.set("#fine", { opacity: 0, y: 20 });
      // each scene only exists during its own beats (hidden text in masks would otherwise overlap other scenes)
      const SCENES = [
        ["#pains", 0, 6.4],
        ["#cap1", 8.4, 10.9],
        ["#photo", 7.9, 11.4],
        ["#big", 10.9, 20.4],
        ["#stage", 10.9, 21.2],
        ["#line2", 20.9, 25.9],
        ["#naka", 20.4, 25.9],
        ["#end", 25.7, 31],
        ["#fine", 27.9, 31],
      ];
      SCENES.forEach(([sel, from]) => gsap.set(sel, { autoAlpha: from === 0 ? 1 : 0 }));
      const phones = gsap.utils.toArray(".phone");
      const ARC = [
        { ry: 20, z: -120 }, { ry: 6, z: 0 }, { ry: -6, z: 0 }, { ry: -20, z: -120 },
      ];
      const CENTER_X = [960 - 350, 960 - 770, 960 - 1150, 960 - 1570];
      phones.forEach((p, i) => gsap.set(p, { x: CENTER_X[i], y: 0, z: -500, rotationY: 0, scale: 0.15, opacity: 0 }));

      // 1. rain: the three pains slam up, get struck through, leave
      cue.pains.forEach((n, i) => {
        tl.fromTo(`#pain${i} .mask > span`, { yPercent: 115 }, { yPercent: 0, duration: b(0.75), ease: "expo.out", immediateRender: false }, b(n));
      });
      tl.fromTo("#pains .strike", { scaleX: 0 }, { scaleX: 1, duration: b(0.5), ease: "power4.out", stagger: 0.06, immediateRender: false }, b(5));
      tl.fromTo("#pains", { opacity: 1, y: 0 }, { opacity: 0, y: -120, duration: b(0.75), ease: "power3.in", immediateRender: false }, b(5.5));

      // 2. the drop: ripple opens the photo, the caption rises
      tl.fromTo("#photo", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(75% at 50% 50%)", duration: b(1.5), ease: "expo.out", immediateRender: false }, b(cue.impact));
      tl.fromTo("#cap1 .a > span", { yPercent: 115 }, { yPercent: 0, duration: b(0.75), ease: "expo.out", immediateRender: false }, b(8.5));
      tl.fromTo("#cap1 .b > span", { yPercent: 115 }, { yPercent: 0, duration: b(0.75), ease: "back.out(1.6)", immediateRender: false }, b(9));
      tl.fromTo("#cap1 .mask > span", { yPercent: 0 }, { yPercent: -115, duration: b(0.5), ease: "power3.in", stagger: 0.05, immediateRender: false }, b(10.25));

      // 3. Naka makes: the photo becomes the core, four phones burst out of it
      tl.fromTo("#photo", { x: 0, y: 0, scale: 1, borderRadius: 40 }, { x: -220, y: -10, scale: 0.3, borderRadius: 320, duration: b(1), ease: "power3.inOut", immediateRender: false }, b(cue.nodeShrink) - b(0.5));
      tl.fromTo("#photo", { opacity: 1 }, { opacity: 0, duration: b(0.4), ease: "power2.in", immediateRender: false }, b(cue.phonesOut));
      tl.fromTo("#big span", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: b(1), ease: "expo.out", immediateRender: false }, b(cue.phonesOut));
      tl.fromTo("#big span", { scale: 1 }, { scale: 1.08, duration: b(cue.whip - cue.phonesOut - 1), ease: "none", immediateRender: false }, b(cue.phonesOut + 1));
      tl.fromTo("#cam", { rotationY: 10, rotationX: 4 }, { rotationY: -10, rotationX: -2, duration: b(cue.whip - cue.phonesOut), ease: "power2.inOut" }, b(cue.phonesOut));
      phones.forEach((p, i) => {
        const at = b(cue.phonesOut) + [0.06, 0, 0, 0.06][i];
        tl.fromTo(p, { x: CENTER_X[i], z: -500, rotationY: 0, scale: 0.15, opacity: 0 }, { x: 0, z: ARC[i].z, rotationY: ARC[i].ry, scale: 1, opacity: 1, duration: b(1), ease: "back.out(1.6)", immediateRender: false }, at);
        tl.fromTo(p, { scale: 1 }, { scale: 1.09, duration: b(0.25), ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, b(cue.punches[i]));
        tl.fromTo(p, { x: 0, opacity: 1 }, { x: -2600 - i * 160, opacity: 1, duration: b(0.75), ease: "power3.in", immediateRender: false }, b(cue.whip) + i * 0.04);
      });
      tl.fromTo("#big span", { opacity: 1 }, { opacity: 0, duration: b(0.5), ease: "power2.in", immediateRender: false }, b(cue.whip));

      // 4. the sky clears: Naka rises, the promise
      tl.fromTo("#naka", { y: 760, rotation: -8 }, { y: 0, rotation: 0, duration: b(1.5), ease: "back.out(1.4)", immediateRender: false }, b(cue.naka));
      tl.fromTo("#naka", { y: 0 }, { y: -18, duration: b(5), ease: "sine.inOut", immediateRender: false }, b(cue.naka) + b(1.5));
      tl.fromTo("#line2 .a > span", { yPercent: 115 }, { yPercent: 0, duration: b(0.75), ease: "expo.out", immediateRender: false }, b(cue.line2));
      tl.fromTo("#line2 .b > span", { yPercent: 115 }, { yPercent: 0, duration: b(0.75), ease: "expo.out", immediateRender: false }, b(cue.line2 + 0.5));
      tl.fromTo("#line2 .mask > span", { yPercent: 0 }, { yPercent: -115, duration: b(0.5), ease: "power3.in", stagger: 0.05, immediateRender: false }, b(25.25));
      tl.fromTo("#naka", { opacity: 1 }, { opacity: 0, duration: b(0.5), ease: "power2.in", immediateRender: false }, b(25.25));

      // 5. signature: the N draws itself, the head settles, the name
      tl.fromTo("#logo .lg-sq", { scale: 0 }, { scale: 1, duration: b(0.75), ease: "back.out(1.8)", immediateRender: false }, b(cue.logo) - b(0.25));
      tl.fromTo("#logo .lg-body", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: b(1.5), ease: "power2.inOut", immediateRender: false }, b(cue.logo));
      tl.fromTo("#logo .lg-head", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: b(0.75), ease: "back.out(2)", stagger: 0.05, immediateRender: false }, b(cue.logoHead));
      tl.fromTo("#word > span", { yPercent: 115 }, { yPercent: 0, duration: b(0.75), ease: "expo.out", immediateRender: false }, b(cue.logoHead));
      tl.fromTo("#tag > span", { yPercent: 115 }, { yPercent: 0, duration: b(0.75), ease: "expo.out", immediateRender: false }, b(cue.tagline));
      tl.fromTo("#fine", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: b(1), ease: "expo.out", immediateRender: false }, b(cue.tagline + 0.5));

      SCENES.forEach(([sel, from, to]) => {
        if (from > 0) tl.set(sel, { autoAlpha: 1 }, b(from));
        if (to < CFG.DURATION_SEC / CFG.SEC_PER_BEAT) tl.set(sel, { autoAlpha: 0 }, b(to));
      });

      render(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
